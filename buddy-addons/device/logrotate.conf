# logrotate configuration for the camera add-ons (dropbear, lighttpd, rsyslog).
# Installed to /userdata/logrotate/logrotate.conf by start-logrotate.sh (card copy wins).
# start-logrotate.sh runs logrotate hourly; "daily" rotates each file once per day.
# lp_app's own logs (/mnt/sdcard/logs/YYYY-MM-DD_HH.log) are not rotated here; see the note at the end.
#
# How each file is reopened or re-read after rotation:
#   - copytruncate: the file keeps its name and inode, and the writer keeps appending
#     (dropbear and the card logs open with O_APPEND, or re-open per line). rsyslog's
#     imfile tails /mnt/sdcard/logs/*.log, so the card logs must keep their names, and
#     rsyslog.conf sets reopenOnTruncate="on" for that input (without it imfile keeps the
#     old offset past the new end of file). Rotated copies are named "<name>.log-YYYYMMDD",
#     which does not match "*.log", so rsyslog never forwards them twice.
#   - rename + SIGHUP: lighttpd reopens its error log on SIGHUP (fdlog_files_cycle).
#
# vfat ignores chown, and "create" chowns the new file, so "nocreate" is set: the
# writer creates the file again on its next write (or on SIGHUP for lighttpd).

daily
rotate 7
dateext
dateformat -%Y%m%d
nocompress
missingok
notifempty

# logrotate skips files whose parent dir is writable by others: the card (vfat, 777) and /tmp
# (1777) both are. "su root root" tells it to rotate as root, which lifts that check.
su root root
nocreate

/mnt/sdcard/logs/dropbear.log
/mnt/sdcard/logs/httpd.log
/mnt/sdcard/logs/rsyslog.log
/tmp/dropbear.log
{
  copytruncate
}

/tmp/lighttpd.log
{
  postrotate
    [ -f /tmp/lighttpd.pid ] && kill -HUP "$(cat /tmp/lighttpd.pid)" 2>/dev/null || true
  endscript
}

# lp_app's own logs are not rotated by logrotate, and nothing below runs. lp_app names one file per
# hour, so the rules above do not fit: copytruncate would copy every closed file, and maxage only
# prunes rotated copies, not these files. The camera held 28 such files (about 583 MB) at the last
# check, 19 of them older than 7 days, so lp_app is not pruning them itself. A 7-day prune would be:
# find /mnt/sdcard/logs -maxdepth 1 -name '20*_*.log' -mtime +7 -exec rm -f {} \;
# (busybox find has no -delete. start-logrotate.sh does not run this line.)
