# rsyslog config for the Buddy3D camera: forward everything to a remote
# syslog server, keep nothing locally.
#
# Installed by start-rsyslog.sh from /mnt/sdcard/bin/rsyslog.conf (card wins).
# EDIT the target below: replace REMOTE_HOST with the IP address or DNS name of
# your syslog server. start-rsyslog.sh refuses to start while REMOTE_HOST is
# still in a non-comment line.
#
# Sources:  /dev/log (syslog() callers, e.g. dropbear), kernel log (/proc/kmsg),
#           /mnt/sdcard/logs/*.log (lp_app logs and the add-on start logs).
# Memory:   34 MB RAM camera, so every queue is small, in RAM only, and drops
#           messages when full instead of blocking or growing.

global(
  # imfile state files (read offsets). /userdata survives reboots.
  workDirectory="/userdata/rsyslog/work"
  maxMessageSize="4k"
  # Name sent as HOSTNAME. Default: the camera's hostname ("Rockchip" on the
  # stock firmware); set one per camera if you have several.
  # localHostname="core-one-l-cam"
  # This build has no TLS; plain UDP/TCP forwarding is intended. Without this
  # rsyslog warns about "insecure defaults" on every start. It also keeps
  # abortOnUncleanConfig off, so one input that fails to start (e.g. imklog)
  # does not stop the others; start-rsyslog.sh rejects broken configs with
  # "rsyslogd -N1" before starting.
  compatibility.defaults.secure="backward-compatible"
)

# Main queue: small, one worker.
main_queue(
  queue.type="LinkedList"
  queue.size="256"
  queue.dequeueBatchSize="32"
  queue.workerThreads="1"
)

# syslog() callers. uClibc's syslog() writes to /dev/log; nothing on the stock
# camera creates that socket, so before this add-on those messages were lost.
module(load="imuxsock" SysSock.Name="/dev/log")

# Kernel log from /proc/kmsg (no klogd on the camera; dmesg keeps working).
module(load="imklog")

# Tail the log files on the card. lp_app writes /mnt/sdcard/logs/YYYY-MM-DD_HH.log.
#  freshStartTail: a file without a saved read offset is read from its end, so
#                  old logs are never re-sent (see rsyslog.md for vfat caveats).
#  ignoreOlderThan: skip files not modified for a day (needs a set clock).
#  addMetadata:    gives $!metadata!filename, used below to tag each file.
#  reopenOnTruncate: logrotate copytruncates these files; without this imfile keeps its old offset.
module(load="imfile" mode="inotify")
input(type="imfile"
      file="/mnt/sdcard/logs/*.log"
      tag="cardlog:"
      addMetadata="on"
      freshStartTail="on"
      ignoreOlderThan="86400"
      reopenOnTruncate="on"
      facility="local0"
      severity="info")

# Forward format: classic BSD syslog (RFC 3164) line, with our own tag.
template(name="CameraFwd" type="string"
         string="<%PRI%>%TIMESTAMP% %HOSTNAME% %$.tag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%")

# Tag per file: lp_app's dated logs -> "lp_app:", other files -> base name
# ("dropbear:", "httpd:", "rsyslog:", ...). Everything else keeps its own tag.
if $inputname == "imfile" then {
  set $.f = replace(replace($!metadata!filename, "/mnt/sdcard/logs/", ""), ".log", "");
  if $.f startswith "20" then {
    set $.tag = "lp_app:";
  } else {
    set $.tag = $.f & ":";
  }
} else {
  set $.tag = $syslogtag;
}

# ---- remote target: EDIT HERE -----------------------------------------------
# UDP 514 (default): fire-and-forget, nothing queues up when the server is down.
# TCP: comment out the protocol/port lines below and use instead
#        protocol="tcp" port="514" TCP_Framing="traditional"
#      (or port="601" TCP_Framing="octet-counted" if your server expects that).
#      With TCP a down server makes the action queue fill; when it is full,
#      new messages are dropped (queue.timeoutEnqueue="0"), never blocking
#      dropbear & co. rsyslog retries the connection forever every 10 s.
action(type="omfwd"
       target="REMOTE_HOST"
       protocol="udp"
       port="514"
       template="CameraFwd"
       action.resumeRetryCount="-1"
       action.resumeInterval="10"
       queue.type="LinkedList"
       queue.size="500"
       queue.dequeueBatchSize="32"
       queue.timeoutEnqueue="0"
       queue.saveOnShutdown="off")
# ---- end remote target -------------------------------------------------------
