# lighttpd.conf - read-only file server for the camera's microSD card.
#
# Edit this file on your computer and upload it to /mnt/sdcard/bin/lighttpd.conf
# (scp/rsync over ssh, or copy it onto the card). Then either reboot or run
#   sh /mnt/sdcard/bin/start-httpd.sh
# start-httpd.sh copies it to /userdata/httpd/lighttpd.conf when it changed,
# checks it with "lighttpd -tt" and restarts the server. A broken config is
# rejected (see /mnt/sdcard/logs/httpd.log) and the running server is kept.
#
# Usage from a host (this config: plain HTTP on 8080, no password):
#   wget --mirror --no-parent --no-host-directories http://CAMERA:8080/
#   wget -c http://CAMERA:8080/timelapse/<job>.avi
#   curl http://CAMERA:8080/some/file.gcode -o file.gcode
#
# WARNING: without TLS and without a password, anyone on the network can read
# every file served here. The lp_app logs in /logs (they can contain the Prusa
# Connect token and Wi-Fi credentials) and /userdata are therefore denied below.
# Plain HTTP is about three times faster than HTTPS on this camera (5 MB/s vs
# 1.1-1.8 MB/s, see docs/features/rsync.md "Transfer speed"). To serve only the
# timelapses, set server.document-root below to "/mnt/sdcard/timelapse".

# mod_staticfile is loaded automatically. mod_indexfile is NOT loaded, so a
# directory always shows its listing (see "directory listing" below).
# For HTTPS add "mod_mbedtls", for basic auth "mod_auth", "mod_authn_file".
server.modules = ( "mod_access", "mod_dirlisting" )

# --- what is served ---------------------------------------------------------
# Change the document root to serve only a sub-directory, e.g. "/mnt/sdcard/timelapse".
server.document-root = "/mnt/sdcard"

# --- ports ------------------------------------------------------------------
# This config: plain HTTP on 8080 only. Ports 22, 23 and 554 are already used
# on the camera. Do not just comment out server.port: lighttpd then listens on
# port 80.
server.port = 8080
#
# To add HTTPS on 8443 (with the self-signed certificate start-httpd.sh creates
# on the first start), add "mod_mbedtls" to server.modules and this block:
#   $SERVER["socket"] == ":8443" {
#     ssl.engine  = "enable"
#     ssl.pemfile = "/userdata/httpd/server.crt"
#     ssl.privkey = "/userdata/httpd/server.key"
#     ssl.openssl.ssl-conf-cmd = ( "MinProtocol" => "TLSv1.2" )
#   }
# HTTPS only: additionally replace "server.port = 8080" with "server.port = 8443"
# and move the four ssl.* lines out of the block (then delete the block).
#
# After a change: upload this file to /mnt/sdcard/bin/lighttpd.conf and run
# "sh /mnt/sdcard/bin/start-httpd.sh" (it checks the file and restarts).

# --- HTTP basic auth (off) --------------------------------------------------
# To require a user and password from /userdata/httpd/htpasswd (copied by
# start-httpd.sh from /mnt/sdcard/bin/htpasswd), add "mod_auth" and
# "mod_authn_file" to server.modules and these lines. Over plain HTTP the
# password is readable on the network; use it together with HTTPS.
#   auth.backend = "htpasswd"
#   auth.backend.htpasswd.userfile = "/userdata/httpd/htpasswd"
#   # remember a login for 10 minutes; the camera CPU is slow at hashing
#   auth.cache = ( "max-age" => "600" )
#   auth.require = ( "" => (
#     "method"  => "basic",
#     "realm"   => "camera",
#     "require" => "valid-user"
#   ) )

# --- process / memory -------------------------------------------------------
# Only /tmp (RAM) for runtime files, never the card. No access log.
server.pid-file = "/tmp/lighttpd.pid"
server.errorlog = "/tmp/lighttpd.log"
server.upload-dirs = ( "/tmp" )
# Single process (no forked workers), few connections: the camera has little RAM.
server.max-worker = 0
# With HTTP/2 enabled lighttpd wants max-fds >= 10 x max-connections.
server.max-fds = 256
server.max-connections = 16
# "simple" = plain stat() cache, no inotify watches on the card.
server.stat-cache-engine = "simple"
server.tag = "lighttpd"

# vfat is case-insensitive. Compare URLs case-insensitively so the deny rules
# below cannot be bypassed with e.g. /RCLONE.CONF.
server.force-lowercase-filenames = "enable"

# --- directory listing ------------------------------------------------------
# Plain HTML table without lighttpd's built-in layout: auto-layout disabled
# means no <html>/<head>, no built-in CSS, no sort JavaScript, no footer, and no
# sort links (would make wget fetch duplicates).
dir-listing.activate = "enable"
dir-listing.auto-layout = "disable"
# Styling for browsers: the header file supplies <head> and inline CSS (no JS,
# no external files), inserted raw before each listing, so wget/curl see the
# same links. Delete these two lines for a bare table.
dir-listing.show-header = "/userdata/httpd/dirlisting-header.html"
dir-listing.encode-header = "disable"
dir-listing.hide-dotfiles = "enable"
dir-listing.encoding = "utf-8"

# Listings are always shown, even if a directory contains index.html, because
# mod_indexfile is not loaded. To serve index pages instead, add "mod_indexfile"
# to server.modules and set e.g. index-file.names = ( "index.html" ).

# Hide the denied secrets from listings too, so wget --mirror does not try to
# fetch them and fail with 403. Regexes on the entry name, (?i) = ignore case
# (vfat). KEEP IN SYNC with url.access-deny below. Needs pcre2.
dir-listing.exclude = ( "(?i)rclone\.conf$", "(?i)\.key$", "(?i)\.pem$", "(?i)authorized_keys$", "(?i)htpasswd$", "(?i)^userdata$", "(?i)^logs$" )

# --- access control ---------------------------------------------------------
# Only GET/HEAD are served (no webdav/cgi modules are loaded).
# Deny secrets by name suffix (works without regex support).
# KEEP IN SYNC with dir-listing.exclude above.
url.access-deny = ( "rclone.conf", ".key", ".pem", "authorized_keys", "htpasswd" )

# /userdata/ on the card holds the copies of the camera's /userdata/* that
# lp_app.sh makes on every boot: xhr_config.ini (Prusa Connect token, Wi-Fi AP
# password) and xhr_http_token.conf. Never serve it. The "^userdata$" entry
# in dir-listing.exclude hides it from listings. Needs pcre2.
$HTTP["url"] =~ "(?i)^/userdata(/|$)" {
  url.access-deny = ( "" )
}

# /logs/ holds the lp_app logs (lp_app --log2file /mnt/sdcard/logs) and the
# add-on logs. lp_app can write the Prusa Connect token, the fingerprint and
# Wi-Fi SSID/password lines into them, and this config has no password, so
# they are not served. Fetch them over ssh/rsync instead. To serve them again
# (only with HTTPS and auth on), delete this block and "(?i)^logs$" from
# dir-listing.exclude. Needs pcre2.
$HTTP["url"] =~ "(?i)^/logs(/|$)" {
  url.access-deny = ( "" )
}

# Deny dot-files/dot-dirs at the top of the card (.Trash-1000, .Spotlight-V100, ...).
# Prefix match, works without regex support.
$HTTP["url"] =^ "/." {
  url.access-deny = ( "" )
}

# --- BEGIN regex block: needs a lighttpd build with pcre2 -------------------
# Deny dot-files/dot-dirs at any depth (e.g. /timelapse/.hidden/x.jpg).
# Remove this block if lighttpd -tt reports that regex/pcre is not supported.
$HTTP["url"] =~ "/\." {
  url.access-deny = ( "" )
}
# --- END regex block --------------------------------------------------------

# --- content types ----------------------------------------------------------
mimetype.assign = (
  ".html"  => "text/html; charset=utf-8",
  ".htm"   => "text/html; charset=utf-8",
  ".txt"   => "text/plain; charset=utf-8",
  ".log"   => "text/plain; charset=utf-8",
  ".conf"  => "text/plain; charset=utf-8",
  ".sh"    => "text/plain; charset=utf-8",
  ".gcode" => "text/plain; charset=utf-8",
  ".json"  => "application/json",
  ".xml"   => "application/xml",
  ".csv"   => "text/csv; charset=utf-8",
  ".jpg"   => "image/jpeg",
  ".jpeg"  => "image/jpeg",
  ".png"   => "image/png",
  ".gif"   => "image/gif",
  ".mp4"   => "video/mp4",
  ".mkv"   => "video/x-matroska",
  ".avi"   => "video/x-msvideo",
  ".h264"  => "video/h264",
  ".zip"   => "application/zip",
  ".gz"    => "application/gzip",
  ".tar"   => "application/x-tar",
  ""       => "application/octet-stream"
)
